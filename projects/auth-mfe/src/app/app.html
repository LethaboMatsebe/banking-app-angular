<div class="auth-box" style="max-width: 400px; margin: 50px auto; padding: 25px; border: 1px solid #ccc; border-radius: 8px; font-family: Arial, sans-serif;">

  @if (!isLoginView) {
  <h2>Create an Account</h2>
  <form [formGroup]="registerForm" (ngSubmit)="onRegisterSubmit()">
    <div style="margin-bottom: 12px;">
      <label style="display:block; font-weight:bold; margin-bottom:4px;">Username</label>
      <input type="text" formControlName="username" style="width:100%; padding:8px; border-radius:4px; border:1px solid #ccc; box-sizing:border-box;">
    </div>
    <div style="margin-bottom: 12px;">
      <label style="display:block; font-weight:bold; margin-bottom:4px;">Email</label>
      <input type="email" formControlName="email" style="width:100%; padding:8px; border-radius:4px; border:1px solid #ccc; box-sizing:border-box;">
    </div>
    <div style="margin-bottom: 12px;">
      <label style="display:block; font-weight:bold; margin-bottom:4px;">Select Role</label>
      <select formControlName="role" style="width:100%; padding:8px; border-radius:4px; border:1px solid #ccc; box-sizing:border-box;">
        <option value="user">User</option>
        <option value="admin">Admin</option>
      </select>
    </div>
    <div style="margin-bottom: 15px;">
      <label style="display:block; font-weight:bold; margin-bottom:4px;">Password</label>
      <input type="password" formControlName="password" style="width:100%; padding:8px; border-radius:4px; border:1px solid #ccc; box-sizing:border-box;">
    </div>
    <button type="submit" [disabled]="registerForm.invalid" style="width:100%; padding:10px; background:#007bff; color:white; font-weight:bold; border:none; border-radius:4px; cursor:pointer;">Register</button>
    <p style="text-align:center; margin-top:15px; font-size:14px;">Already have an account? <a href="#" (click)="$event.preventDefault(); isLoginView = true">Login here</a></p>
  </form>
  } @else {
  <h2>Login to Your Account</h2>
  <form [formGroup]="loginForm" (ngSubmit)="onLoginSubmit()">
    <div style="margin-bottom: 12px;">
      <label style="display:block; font-weight:bold; margin-bottom:4px;">Email Address</label>
      <input type="email" formControlName="email" style="width:100%; padding:8px; border-radius:4px; border:1px solid #ccc; box-sizing:border-box;">
    </div>
    <div style="margin-bottom: 15px;">
      <label style="display:block; font-weight:bold; margin-bottom:4px;">Password</label>
      <input type="password" formControlName="password" style="width:100%; padding:8px; border-radius:4px; border:1px solid #ccc; box-sizing:border-box;">
    </div>
    <button type="submit" [disabled]="loginForm.invalid" style="width:100%; padding:10px; background:#28a745; color:white; font-weight:bold; border:none; border-radius:4px; cursor:pointer;">Login</button>
    <p style="text-align:center; margin-top:15px; font-size:14px;">Need an account? <a href="#" (click)="$event.preventDefault(); isLoginView = false">Register here</a></p>
  </form>
  }
</div>
